# 算法可视化题库 · 静态站点配置
# 纯静态，不需要后端；要求 nginx >= 1.18

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 中文文件名已统一改成 ASCII 短链名，这里再兜一层编码兜底
    charset_types text/html text/css application/javascript text/plain;

    # ---- 入口与清单：绝不缓存，刷新就能看到新题 ----
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /problems.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- 主题页 HTML：短缓存，方便改完立刻生效 ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(?:js|css|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝（.git、.env 之类）
    location ~ /\. {
        deny all;
    }

    access_log off;
}
