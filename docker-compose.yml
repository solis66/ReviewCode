# 独立容器方式部署：不碰服务器上已有的 nginx，单独占一个端口
#
#   docker compose up -d --build
#   docker compose logs -f
#
# 访问 http://<服务器IP>:8090
# 如果 8090 被占用，改下面 ports 的左边那个数字即可。

name: algo-visual

services:
  algo-portal:
    build: .
    image: algo-visual-portal:latest
    container_name: algo-visual-portal
    restart: unless-stopped
    ports:
      - "8090:80"
