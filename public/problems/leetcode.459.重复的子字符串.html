<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode 459 · 重复的子字符串</title>
  <style>
    :root{--bg:#f5f7fb;--ink:#172033;--muted:#6d7890;--line:#dbe2ef;--blue:#3677f6;--blue-soft:#eaf1ff;--orange:#ed8b32;--orange-soft:#fff1e5;--green:#1eaa72;--green-soft:#e7f8f0;--red:#dc5b5b;--shadow:0 12px 34px rgba(31,51,86,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    .shell{max-width:1220px;margin:0 auto;padding:30px 22px 48px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.11em;font-size:12px;text-transform:uppercase}.title{font-size:30px;letter-spacing:-.02em;margin:6px 0 6px}.subtitle{color:var(--muted);margin:0}.badge{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:10px;color:var(--muted);white-space:nowrap}.badge b{color:var(--ink)}
    .controls,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.controls{padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.controls label{font-weight:700;color:var(--muted)}input[type=text]{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;color:var(--ink);min-width:220px;outline:none}input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}button{height:38px;border:0;border-radius:8px;padding:0 14px;font:700 13px inherit;cursor:pointer;transition:.18s ease}button:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:#fff}.ghost{background:#f0f3f8;color:var(--ink)}.speed{display:flex;align-items:center;gap:8px;color:var(--muted);margin-left:auto}.speed input{accent-color:var(--blue)}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.95fr);gap:18px}.panel{padding:20px}.panel h2{font-size:15px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}.panel h2 span{font-size:12px;color:var(--muted);font-weight:500}.stage{min-height:480px}.section{margin-bottom:26px}.section:last-child{margin-bottom:0}.section-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.cells{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 12px}.cell-wrap{display:flex;flex-direction:column;align-items:center;min-width:43px;gap:5px}.index{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}.cell{height:46px;width:43px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font:700 19px ui-monospace,SFMono-Regular,Consolas,monospace;background:#fff;transition:.25s}.cell.sentinel{background:#f1f3f7;color:#a0a8b8;border-style:dashed}.cell.process{background:var(--blue-soft);border-color:#8db0ff;color:#245dcc;box-shadow:0 0 0 3px rgba(54,119,246,.10)}.cell.compare{background:var(--orange-soft);border-color:#f3ac6a;color:#b85d16}.cell.match{background:var(--green-soft);border-color:#73d3a8;color:#147b52}.cell.fallback{background:#fff0f0;border-color:#ee9c9c;color:#b73c3c}.cell.done{background:#edf9f4;border-color:#8fdaba;color:#197a54}.pointer{height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--blue)}
    .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}.legend-item{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{height:10px;width:10px;border-radius:3px;background:#ddd}.dot.blue{background:#8db0ff}.dot.orange{background:#f3ac6a}.dot.green{background:#73d3a8}.dot.red{background:#ee9c9c}
    .next-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px;overflow-x:auto}.next-item{border:1px solid var(--line);border-radius:9px;padding:8px 3px;text-align:center;background:#fbfcfe;transition:.25s}.next-item .nidx{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.next-item strong{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace}.next-item.current{border-color:var(--blue);background:var(--blue-soft);color:#245dcc;box-shadow:0 0 0 3px rgba(54,119,246,.10)}
    .side{display:flex;flex-direction:column;gap:18px}.explain{background:#f8faff;border:1px solid #dce7ff;border-radius:10px;padding:13px 14px;color:#34415b;min-height:88px}.explain b{display:block;color:var(--ink);margin-bottom:4px}.formula{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f7f8fb;border-radius:8px;padding:10px 12px;margin-top:10px;color:#44506a}.result{border-radius:10px;padding:14px;border:1px solid var(--line);background:#fbfcfe}.result.good{background:var(--green-soft);border-color:#a8e3c7}.result.bad{background:#fff4f4;border-color:#f0baba}.result-label{font-size:12px;color:var(--muted);margin-bottom:3px}.result-value{font-size:22px;font-weight:800}.progress{height:6px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:var(--blue);width:0;transition:.25s}.steps{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}.steps b{color:var(--ink)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.speed{margin-left:0}.top{flex-direction:column}.badge{align-self:flex-start}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">LeetCode 459 · KMP</div><h1 class="title">重复的子字符串</h1><p class="subtitle">用前缀函数追踪“最长相等前后缀”，一步看懂周期如何出现。</p></div><div class="badge">当前模式：<b>1-based + 哨兵</b></div></header>
    <section class="controls"><label for="input">输入字符串</label><input id="input" type="text" value="abababab" maxlength="18" spellcheck="false"/><button class="primary" id="run">重新生成</button><button class="ghost" id="reset">重置</button><button class="ghost" id="step">下一步</button><button class="primary" id="play">▶ 自动播放</button><div class="speed">速度 <input id="speed" type="range" min="250" max="1300" value="650" step="50"/><span id="speedText">650ms</span></div></section>
    <div class="layout"><section class="panel stage"><h2>算法现场 <span id="phase">准备开始</span></h2><div class="section"><div class="section-title">原串（加哨兵后从 1 开始）</div><div id="chars" class="cells"></div><div class="legend"><span class="legend-item"><i class="dot blue"></i>当前 i / j</span><span class="legend-item"><i class="dot orange"></i>正在比较</span><span class="legend-item"><i class="dot green"></i>匹配成功</span><span class="legend-item"><i class="dot red"></i>回退</span></div></div><div class="section"><div class="section-title">next 前缀表</div><div id="next" class="next-grid"></div></div><div class="steps"><b id="stepNo">0</b><span>/</span><span id="stepTotal">0</span><span>帧</span><span>·</span><span id="vars">i = —，j = —</span></div><div class="progress"><i id="progress"></i></div></section><aside class="side"><section class="panel"><h2>这一帧发生了什么</h2><div class="explain"><b id="headline">点击“下一步”开始</b><span id="detail">先观察哨兵空格，再让 i 从 2 扫描到字符串末尾。</span></div><div class="formula" id="formula">next[len] = —</div></section><section class="panel"><h2>最终判定</h2><div id="result" class="result"><div class="result-label">等待算法走完</div><div class="result-value">—</div></div></section></aside></div>
  </main>
  <script>
    const $=s=>document.querySelector(s); let frames=[], cursor=0, timer=null;
    function makeFrames(raw){
      const s=' '+raw, n=raw.length, next=Array(n+1).fill(0), out=[];
      const snap=(kind, headline, detail, i, j, compare=[], fallback=[], done=[])=>out.push({kind,headline,detail,i,j,next:[...next],compare,fallback,done});
      snap('init','初始化哨兵','空格占据下标 0；因此 j 从 0 开始，i 从 2 开始。',1,0,[],[],[]);
      for(let i=2,j=0;i<=n;i++){
        while(j>0 && s[i]!==s[j+1]){snap('fallback',`s[${i}] ≠ s[${j+1}]，j 回退`,`比较 “${s[i]}” 与 “${s[j+1]}”，沿 next[${j}] 回到 ${next[j]}。`,i,j,[i,j+1],[j],[]);j=next[j];snap('fallback',`回退完成，j = ${j}`,'继续用更短的相等前后缀尝试匹配。',i,j,[i,j+1],[j],[])}
        if(s[i]===s[j+1]){j++;next[i]=j;snap('match',`匹配成功，next[${i}] = ${j}`,`“${s[i]}” 与 “${s[j]}” 相等，最长相等前后缀长度增加到 ${j}。`,i,j,[i,j],[i],[])}
        else {next[i]=j;snap('miss',`无法延伸，next[${i}] = 0`,`没有可复用的前缀，保留 j = 0。`,i,j,[i,j+1],[i],[])}
      }
      const border=next[n], period=n-border, yes=n>0&&border>0&&n%period===0;
      snap('result',yes?'发现重复周期':'不是重复拼接',`next[${n}] = ${border}，候选周期 = ${n} − ${border} = ${period}。`,n,border,[],[],Array.from({length:n},(_,k)=>k+1));
      return {s,n,next,yes,border,period,frames:out};
    }
    function render(){const raw=$('#input').value, data=makeFrames(raw); frames=data.frames; cursor=0; window.state=data; draw(data.frames[0]); if(timer){clearInterval(timer);timer=null} $('#play').textContent='▶ 自动播放'; $('#stepTotal').textContent=frames.length;}
    function draw(f){const d=window.state, chars=$('#chars'), nextEl=$('#next'); chars.innerHTML=''; for(let k=0;k<=d.n;k++){const w=document.createElement('div');w.className='cell-wrap'; const idx=document.createElement('span');idx.className='index';idx.textContent=k; const c=document.createElement('div');c.className='cell';c.textContent=d.s[k]||'·'; if(k===0)c.classList.add('sentinel'); if(f.compare.includes(k))c.classList.add('compare'); if(f.fallback.includes(k))c.classList.add('fallback'); if(f.done.includes(k))c.classList.add('done'); if(k===f.i||k===f.j)c.classList.add('process'); if(f.kind==='match'&&f.compare.includes(k))c.classList.add('match'); w.append(idx,c); const p=document.createElement('div');p.className='pointer';p.textContent=k===f.i?'i':k===f.j?'j':'';w.append(p);chars.append(w)} nextEl.innerHTML=''; for(let k=0;k<=d.n;k++){const x=document.createElement('div');x.className='next-item'+(k===f.i?' current':'');x.innerHTML=`<span class="nidx">${k}</span><strong>${f.next[k]}</strong>`;nextEl.append(x)} $('#headline').textContent=f.headline;$('#detail').textContent=f.detail;$('#formula').textContent=`next[${d.n}] = ${f.next[d.n]}  ·  len = ${d.n}`;$('#phase').textContent=f.kind==='result'?'判定完成':f.kind==='init'?'准备扫描':`构造中 · i = ${f.i}`;$('#stepNo').textContent=cursor+1;$('#vars').textContent=`i = ${f.i}，j = ${f.j}`;$('#progress').style.width=((cursor)/(frames.length-1||1)*100)+'%'; const r=$('#result'); if(f.kind==='result'){r.className='result '+(d.yes?'good':'bad');r.innerHTML=`<div class="result-label">${d.yes?'len % (len − next[len]) === 0':'未满足周期条件'}</div><div class="result-value">${d.yes?`是 · 周期长度 ${d.period}`:'否 · 不是重复子串'}</div>`}else{r.className='result';r.innerHTML='<div class="result-label">等待算法走完</div><div class="result-value">—</div>'}}
    function nextStep(){if(cursor<frames.length-1){cursor++;draw(frames[cursor])}else stop()}
    function stop(){if(timer){clearInterval(timer);timer=null}$('#play').textContent='▶ 自动播放'}
    $('#run').onclick=render; $('#reset').onclick=()=>{$('#input').value='abababab';render()}; $('#step').onclick=()=>{stop();nextStep()}; $('#play').onclick=()=>{if(timer){stop()}else{if(cursor>=frames.length-1){cursor=0;draw(frames[0])}timer=setInterval(nextStep,Number($('#speed').value));$('#play').textContent='Ⅱ 暂停'}}; $('#speed').oninput=e=>$('#speedText').textContent=e.target.value+'ms'; $('#input').onkeydown=e=>{if(e.key==='Enter')render()}; render();
  </script>
</body></html>
