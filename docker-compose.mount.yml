# 挂载式部署：把仓库里的 public/ 直接挂进 nginx 容器。
#
#   docker compose -f docker-compose.mount.yml up -d
#
# 相比 Dockerfile 那套（每次都要 --build），这条路径更新最快：
#   git pull  之后新内容立即生效，不用重建镜像，也不用重启容器
#   （nginx 每次请求都读磁盘，静态文件不做缓存）。
#
# 自带一个现成的 nginx 镜像即可，不需要 Dockerfile。
# 如果服务器上已经有 nginx 容器，用它的那个镜像 tag 替换下面的 image，省一次拉取。
#
# 注意：本文件和 docker-compose.yml 用的是同一个项目名与容器名，
# 切换方案时 compose 会自动重建容器，不要两个文件同时 up。

name: algo-visual

services:
  algo-portal:
    image: nginx:1.27-alpine
    container_name: algo-visual-portal
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      # :ro 只读挂载 —— 容器里没有任何东西可以改动仓库文件
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
